name: Remote Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Download and Unzip
        run: |
          curl -L -o project.zip https://files.manuscdn.com/user_upload_by_module/session_file/310519663709565633/QjwutQxWSKcMkmTz.zip
          unzip project.zip
          cp -r home/ubuntu/myanmar_voice_assistant/* .
          cp -r home/ubuntu/myanmar_voice_assistant/.* . 2>/dev/null || true

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Build APK
        run: |
          flutter config --no-analytics
          flutter pub get
          flutter build apk --release --no-tree-shake-icons

      - name: Upload APK
        uses: actions/upload-artifact@v3
        with:
          name: myanmar-voice-assistant-apk
          path: build/app/outputs/flutter-apk/app-release.apk
