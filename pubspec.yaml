name: myanmar_voice_assistant
description: A Myanmar-language voice AI assistant with voice profile security, natural language reminders, OCR reading, and offline-first storage.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.2
  flutter_tts: ^3.8.5
  speech_to_text: ^6.6.2
  google_mlkit_text_recognition: ^0.11.0
  image_picker: ^1.0.7
  android_alarm_manager_plus: ^3.0.4
  flutter_local_notifications: ^17.0.0
  intl: ^0.19.0
  permission_handler: ^11.3.0
  provider: ^6.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
